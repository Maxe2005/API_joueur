spring.application.name=API_joueur

# --- MongoDB Configuration ---
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27020}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:gatcha-player-db}
spring.data.mongodb.auto-index-creation=true

# --- Actuator (Health Checks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# --- External APIs ---
gatcha.auth-api.host=${AUTH_API_HOST:http://host.docker.internal}
gatcha.auth-api.port=${AUTH_API_PORT:8080}
gatcha.auth-api.connect-timeout-ms=${AUTH_API_CONNECT_TIMEOUT_MS:3000}
gatcha.auth-api.read-timeout-ms=${AUTH_API_READ_TIMEOUT_MS:5000}

# --- Sidecar dev-token-provider (Story 1.1 / AD-8) --- n'a d'effet que si le profil Spring
# "dev-local" est actif (DEV_LOCAL_SPRING_PROFILE) ; DevAutoAuthConfig ne lit ces propriétés que
# dans ce cas.
gatcha.dev-token-provider.host=${DEV_TOKEN_PROVIDER_HOST:http://dev-token-provider}
gatcha.dev-token-provider.port=${DEV_TOKEN_PROVIDER_PORT:9876}

# --- Comptes par défaut (mêmes usernames que ceux seedés côté API_authentification) ---
app.default-users.admin.username=${DEFAULT_ADMIN_USERNAME:}
app.default-users.user.username=${DEFAULT_USER_USERNAME:}

# --- Story 2.1 : corrélation X-Request-Id ---
# Le pattern console par défaut n'affiche pas le MDC ; on ajoute l'identifiant à chaque ligne.
logging.pattern.level=%5p [%X{X-Request-Id:-}]